name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          python -m py_compile root/usr/bin/subparser.py root/usr/bin/subparser-bot.py root/usr/lib/subparser/*.py
          python -m unittest discover -s tests -v

      - name: Build packages and portable archive
        run: |
          chmod +x build-release.sh build_ipk.sh build_apk.sh build_archive.sh
          sh build-release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subparser-packages
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SubParser ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## SubParser ${{ github.ref_name }}

            Пакет: `1.0.0` · ядро парсера: `2.1.9`.

            | OpenWrt | Файл |
            |---|---|
            | 19.x – 24.10 (opkg) | `luci-app-subparser_1.0.0-1_all.ipk` |
            | 25.12+ (apk) | `luci-app-subparser-1.0.0-r1.apk` |
            | Любая версия (портативный архив) | `subparser-1.0.0.tar.gz` |

            Установка IPK:
            ```sh
            wget -O /tmp/luci-app-subparser.ipk \
              https://github.com/ib0lit/SubParser/releases/download/${{ github.ref_name }}/luci-app-subparser_1.0.0-1_all.ipk
            opkg install /tmp/luci-app-subparser.ipk
            ```

            Установка APK:
            ```sh
            wget -O /tmp/luci-app-subparser.apk \
              https://github.com/ib0lit/SubParser/releases/download/${{ github.ref_name }}/luci-app-subparser-1.0.0-r1.apk
            apk add --allow-untrusted /tmp/luci-app-subparser.apk
            ```

            Портативный архив:
            ```sh
            cd /tmp
            wget -O subparser-1.0.0.tar.gz \
              https://github.com/ib0lit/SubParser/releases/download/${{ github.ref_name }}/subparser-1.0.0.tar.gz
            tar -xzf subparser-1.0.0.tar.gz
            cd subparser-1.0.0
            sh install.sh --local
            ```

            Контрольные суммы — в `SHA256SUMS`.
          files: |
            dist/*.ipk
            dist/*.apk
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
